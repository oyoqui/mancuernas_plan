<title>Un año con mancuernas</title>

<style>
:root{color-scheme:light;
 --bg:#EEF1F3;--panel:#FFFFFF;--ink:#17212B;--muted:#5D6B78;--line:#CBD3DA;--soft:#E3E8EC;
 --g:#3E8E5A;--y:#D9A92E;--b:#2F63C9;--r:#C8372D;--real:#1F4FBF;--goal:#8794A1;
 --disp:"Bahnschrift","DIN Alternate","DIN 2014","Segoe UI",system-ui,sans-serif;
 --body:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
a{color:var(--real)}
h1,h2,h3,h4{font-family:var(--disp);font-weight:600;margin:0;line-height:1.15;letter-spacing:.01em}
h1{font-size:34px;font-weight:700;font-stretch:condensed}
h2{font-size:24px}h3{font-size:19px}h4{font-size:16px}
p{margin:.4em 0 .8em;max-width:76ch}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--real);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
/* hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}
.hero .sub{color:var(--muted);margin-top:4px}
.bar{margin:18px 0 6px;display:flex;align-items:center;gap:0}
.bar .grip{width:28px;height:10px;background:#9AA5AF;border-radius:2px}
.bar .collar{width:8px;height:30px;background:#6F7B86;border-radius:2px}
.plates{display:flex;gap:3px;flex:1;align-items:center}
.plate{flex:1;height:54px;border-radius:4px;border:0;cursor:pointer;position:relative;opacity:.32;padding:0}
.plate.past{opacity:1}
.plate.now{opacity:1;height:70px;box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--ink)}
.plate span{position:absolute;inset:auto 0 3px 0;font:600 10px var(--disp);color:#fff;text-align:center}
.plate.part{background-image:linear-gradient(to top,rgba(255,255,255,0) var(--f),rgba(255,255,255,.55) var(--f))}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);background:var(--panel);border-radius:6px}
.nums div{padding:12px 14px;border-left:1px solid var(--line)}
.nums div:first-child{border-left:0}
.nums b{display:block;font:700 28px var(--disp)}
.nums small{color:var(--muted)}
.digest{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--ink);border-radius:6px;padding:12px 16px}
.digest h4{margin-bottom:4px}
.digest p{margin:.2em 0}
.digest .who{font-size:12px;color:var(--muted)}
/* tabs */
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:26px 0 16px;border-bottom:2px solid var(--ink)}
nav.tabs button{background:none;border:0;padding:9px 14px;font:600 15px var(--disp);cursor:pointer;color:var(--muted);border-radius:6px 6px 0 0}
nav.tabs button[aria-selected=true]{background:var(--ink);color:#fff}
section[hidden]{display:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.btn{background:var(--ink);color:#fff;border:0;border-radius:5px;padding:7px 13px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.sm{padding:4px 9px;font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;color:#fff}
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px 18px;margin:10px 0}
.params div small{display:block;color:var(--muted);font-size:12.5px}
.params div b{font-family:var(--disp);font-weight:600}
blockquote{margin:8px 0;padding:6px 14px;border-left:4px solid var(--line);font-family:var(--disp);font-size:17px;color:#33414E}
/* session table */
.sess{border:1px solid var(--line);border-radius:6px;margin:12px 0;overflow:hidden}
.sess header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--soft);flex-wrap:wrap}
.sess header label{font-weight:600;cursor:pointer}
.sess.done header{background:#DCEFE2}
table{border-collapse:collapse;width:100%}
.sess table td,.sess table th{padding:8px 10px;border-top:1px solid var(--soft);vertical-align:top;text-align:left}
.sess th{font-size:12.5px;color:var(--muted);font-weight:600}
.slot{font:700 15px var(--disp);width:38px}
.exbtn{background:none;border:0;padding:0;color:var(--real);font-weight:600;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.hint{font-size:12.5px;color:var(--muted);margin-top:3px}
.hint.up{color:var(--g);font-weight:600}
.sets{display:flex;flex-wrap:wrap;gap:6px}
.set{display:flex;align-items:center;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fff}
.set input{width:46px;border:0;padding:5px 4px;text-align:center;background:transparent}
.set input+input{border-left:1px solid var(--soft)}
.set em{font-style:normal;font-size:11px;color:var(--muted);padding:0 4px;background:var(--soft);align-self:stretch;display:flex;align-items:center}
.set.ok{border-color:var(--g);background:#F1F9F3}
textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:5px;padding:6px 8px}
.weekbar{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:10px 14px;border:1px dashed var(--line);border-radius:6px;margin:10px 0}
.meter{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;width:180px}
.meter i{display:block;height:100%;background:var(--ink)}
.days{display:flex;flex-wrap:wrap;gap:8px}
.day{border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:126px;background:#fff}
.day.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day small{color:var(--muted);display:block}
.day.ok{background:#F1F9F3;border-color:var(--g)}
/* forms */
.grid-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px}
.grid-form label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.grid-form input,.grid-form select{border:1px solid var(--line);border-radius:5px;padding:6px 8px;color:var(--ink);background:#fff}
fieldset{border:1px solid var(--line);border-radius:6px;margin:12px 0;padding:10px 14px}
legend{font:600 15px var(--disp);padding:0 6px}
.derived{display:flex;flex-wrap:wrap;gap:18px;margin-top:10px;font-size:14px}
.derived b{font-family:var(--disp);font-size:18px}
.links li{margin:4px 0}
.periodnav{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.periodnav button{width:40px;height:34px;border:0;border-radius:4px;color:#fff;font:600 13px var(--disp);cursor:pointer;opacity:.55}
.periodnav button[aria-current=true]{opacity:1;box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:5px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 12px;cursor:pointer;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
/* charts */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.chart .cv{position:relative;height:270px}
.chart p{font-size:13px;color:var(--muted);margin:2px 0 8px}
/* library */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lib button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer}
.lib button b{display:block;font-family:var(--disp);font-weight:600}
.lib button small{color:var(--muted)}
input[type=search]{border:1px solid var(--line);border-radius:5px;padding:7px 10px;width:min(360px,100%)}
/* modal */
dialog{border:0;border-radius:8px;padding:0;max-width:620px;width:calc(100% - 28px);box-shadow:0 18px 50px rgba(23,33,43,.35)}
dialog::backdrop{background:rgba(23,33,43,.45)}
dialog .in{padding:18px 20px}
dialog ul{padding-left:18px}
.alert{border-left:5px solid var(--r);background:#FBEDEC;padding:10px 14px;border-radius:5px;margin:10px 0}
.ok-note{border-left:5px solid var(--g);background:#EEF7F1;padding:10px 14px;border-radius:5px;margin:10px 0}
.cols{columns:2 320px;column-gap:28px}
.cols>div{break-inside:avoid;margin-bottom:14px}
ul.tight{margin:.3em 0;padding-left:20px}
ul.tight li{margin:2px 0}
.kpi{font:700 30px var(--disp)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:6px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:820px){.hero{grid-template-columns:1fr}.charts{grid-template-columns:1fr}.nums b{font-size:22px}.plate{height:40px}.plate.now{height:52px}.plate span{display:none}
 .sess table thead{display:none}.sess table tr{display:grid;grid-template-columns:38px 1fr;border-top:1px solid var(--soft)}.sess table td{border:0;padding:6px 8px}.sess table td.sl{grid-row:span 4}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ================= DATA ================= */
const EX = {"E01": {"n": "Sentadilla goblet a cajón/silla", "m": "Cuádriceps, glúteos, core", "k": "Mancuerna vertical pegada al pecho; pies al ancho de hombros; siéntate atrás hasta rozar la silla sin dejarte caer y sube empujando el suelo.", "e": "Rodillas hacia adentro; talones que se levantan; dejarse caer en la silla.", "en": "https://www.youtube.com/results?search_query=dumbbell+goblet+box+squat+form", "es": "https://www.youtube.com/results?search_query=como+hacer+Sentadilla+goblet+a+caj%C3%B3n%2Fsilla+t%C3%A9cnica+correcta"}, "E02": {"n": "Remo a una mano con apoyo", "m": "Dorsal, romboides, bíceps", "k": "Mano y rodilla en banco/silla; espalda plana; tira del codo hacia la cadera.", "e": "Girar el torso; tirar con el bíceps.", "en": "https://www.youtube.com/results?search_query=one+arm+dumbbell+row+form", "es": "https://www.youtube.com/results?search_query=como+hacer+Remo+a+una+mano+con+apoyo+t%C3%A9cnica+correcta"}, "E03": {"n": "Flexiones inclinadas (manos en mesa/banco)", "m": "Pecho, tríceps, hombro anterior, core", "k": "Cuerpo en línea recta de cabeza a talones; manos un poco más abiertas que los hombros; codos a ~45°. Superficie más baja = más difícil.", "e": "Cadera caída; codos abiertos a 90°; cabeza adelantada.", "en": "https://www.youtube.com/results?search_query=incline+push+up+proper+form", "es": "https://www.youtube.com/results?search_query=como+hacer+Flexiones+inclinadas+t%C3%A9cnica+correcta"}, "E04": {"n": "Puente de glúteo con mancuerna", "m": "Glúteos, isquios", "k": "Tumbado, mancuerna sobre la cadera; empuja con talones, aprieta glúteos 1 s arriba.", "e": "Arquear la espalda baja en lugar de usar glúteos.", "en": "https://www.youtube.com/results?search_query=dumbbell+glute+bridge+form", "es": "https://www.youtube.com/results?search_query=como+hacer+Puente+de+gl%C3%BAteo+con+mancuerna+t%C3%A9cnica+correcta"}, "E05": {"n": "Press de hombro sentado", "m": "Deltoides, tríceps", "k": "Sentado con respaldo; mancuernas a la altura de las orejas; sube sin arquear la espalda.", "e": "Arquear la espalda baja; chocar las mancuernas.", "en": "https://www.youtube.com/results?search_query=seated+dumbbell+shoulder+press+form", "es": "https://www.youtube.com/results?search_query=como+hacer+Press+de+hombro+sentado+t%C3%A9cnica+correcta"}, "E06": {"n": "Elevación de talones de pie", "m": "Gemelos, sóleo", "k": "Sube hasta la punta, pausa 1 s, baja lento; apóyate en una pared.", "e": "Rebotar; rango corto.", "en": "https://www.youtube.com/results?search_query=dumbbell+standing+calf+raise", "es": "https://www.youtube.com/results?search_query=como+hacer+Elevaci%C3%B3n+de+talones+de+pie+t%C3%A9cnica+correcta"}, "E07": {"n": "Dead bug (bicho muerto)", "m": "Abdomen profundo", "k": "Espalda baja pegada al suelo; extiende brazo y pierna contrarios lentamente; exhala al extender.", "e": "Despegar la lumbar del suelo; ir rápido.", "en": "https://www.youtube.com/results?search_query=dead+bug+exercise+form", "es": "https://www.youtube.com/results?search_query=como+hacer+Dead+bug+t%C3%A9cnica+correcta"}, "E08": {"n": "Peso muerto rumano con mancuernas", "m": "Isquiotibiales, glúteos, espalda baja", "k": "Rodillas ligeramente flexionadas; lleva la cadera atrás como cerrando una puerta con el trasero; mancuernas pegadas a las piernas; espalda neutra.", "e": "Redondear la espalda; convertirlo en sentadilla; mancuernas lejos del cuerpo.", "en": "https://www.youtube.com/results?search_query=dumbbell+romanian+deadlift+form", "es": "https://www.youtube.com/results?search_query=como+hacer+Peso+muerto+rumano+con+mancuernas+t%C3%A9cnica+correcta"}, "E09": {"n": "Press de pecho en el suelo", "m": "Pecho, tríceps", "k": "Tumbado, rodillas flexionadas; baja hasta que los tríceps toquen el suelo suavemente; codos a 45°.", "e": "Golpear los codos contra el suelo; muñecas dobladas.", "en": "https://www.youtube.com/results?search_query=dumbbell+floor+press+form", "es": "https://www.youtube.com/results?search_query=como+hacer+Press+de+pecho+en+e function dateOf(i){const d=startDate();d.setDate(d.getDate()+i);return d;}
function today(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate(),12);}
function dayIdx(d){return Math.round((d-startDate())/864e5);}
function fmt(d){return `${DOW[(d.getDay()+6)%7]} ${String(d.getDate()).padStart(2,"0")}-${MON[d.getMonth()]}-${d.getFullYear()}`;}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function posOf(i){i=Math.max(0,Math.min(363,i));const p=Math.floor(i/14)+1,w=Math.floor((i%14)/7)+1,dow=i%7;return {p,w,dow,week:(p-1)*2+w,i};}

const P = p => PERIODS[p-1];
const blockOf = p => BLOCKS[P(p).b-1];
function listFor(p){return LISTS[P(p).b+"-"+P(p).v];}
function codesFor(p,s){return listFor(p)[s].split(" ");}
function spec(p,w){return P(p).w[w-1];}
function plannedSets(p,w,slot){const sp=spec(p,w);
 if(slot==="D") return (p===1&&w===1)?2:3;
 if(slot[0]==="C") return sp.as;
 if(sp.first&&(slot==="A1"||slot==="B1")) return sp.first;
 return sp.ms;}
function repText(p,w,slot,code){const sp=spec(p,w),uni=UNI.includes(code)?" por lado":"";
 if(slot==="D"){const t=dTypeOf(code);
  if(t==="time") return `${plannedSets(p,w,slot)} × ${CORE_T[p-1]} s`+(SIDE_TIME.includes(code)?" por lado":"");
  if(t==="reps") return `${plannedSets(p,w,slot)} × ${CORE_R[p-1]} por lado`;
  if(t==="carry") return `${plannedSets(p,w,slot)} × ${CARRY[p-1]} m`;
  return `${plannedSets(p,w,slot)} × 10`;}
 const isMain=slot[0]!=="C";
 const n=plannedSets(p,w,slot), r=isMain?sp.mr:sp.ar;
 return `${n} × ${r}${uni}`+(sp.dl?" · descarga":"");}
function loadText(p,w,code){const c=clsOf(code),L=P(p).load,dl=spec(p,w).dl?" (−30 %)":"";
 if(c==="BW") return "Peso corporal";
 if(c==="CL") return L[0]+" kg c/mano"+dl;
 if(c==="CU") return L[1]+" kg"+dl;
 return ({L:L[0],U:L[1],S:L[2]})[c]+" kg"+dl;}
function topOf(r){const m=String(r).match(/(\d+)\s*–\s*(\d+)/);if(m) return +m[2];const n=String(r).match(/(\d+)/);return n?+n[1]:null;}
function unitFor(slot,code){if(slot!=="D") return "reps";const t=dTypeOf(code);return t==="time"?"s":t==="carry"?"m":"reps";}
const sKey=(p,w,s)=>`P${p}W${w}${s}`;
function sessOrder(p,w,s){return ((p-1)*2+w)*10+({A:0,B:1,C:2}[s]);}
function logOf(p,w,s,create){const k=sKey(p,w,s);if(!S.logs[k]&&create) S.logs[k]={done:false,sets:{},note:""};return S.logs[k];}
function setsDone(log){if(!log) return 0;let n=0;for(const sl in log.sets) for(const x of log.sets[sl]) if(x&&+x.r>0) n++;return n;}
function weekPlanned(p,w){let n=0;for(const s of ["A","B","C"]) for(const sl of SLOTS) n+=plannedSets(p,w,sl);return n;}
function weekDone(p,w){let n=0;for(const s of ["A","B","C"]) n+=setsDone(S.logs[sKey(p,w,s)]);return n;}
function sessionsDone(p,w){return ["A","B","C"].filter(s=>S.logs[sKey(p,w,s)]&&S.logs[sKey(p,w,s)].done).length;}
function activeDone(p,w){return [1,3,5].filter(d=>S.active[`P${p}W${w}D${d}`]).length;}
function lastFor(code,beforeOrder){let best=null;
 for(const k in S.logs){const m=k.match(/^P(\d+)W(\d)([ABC])$/);if(!m) continue;const p=+m[1],w=+m[2],s=m[3],o=sessOrder(p,w,s);
  if(o>=beforeOrder) continue;const codes=codesFor(p,s);const idx=codes.indexOf(code);if(idx<0) continue;
  const arr=(S.logs[k].sets[SLOTS[idx]]||[]).filter(x=>x&&+x.r>0);if(!arr.length) continue;
  if(!best||o>best.o) best={o,p,w,s,slot:SLOTS[idx],arr};}
 return best;}

/* ================= METRICS ================= */
function ck(p){return S.checkins[p]||{};}
function latestWeight(){let best=null;
 for(let k=0;k<=52;k++){const v=weightAtWeek(k);if(v) best={k,v};}
 return best||{k:0,v:S.settings.startWeight};}
function weightAtWeek(k){ // k: 0..52 (0 = inicio)
 if(k===0) return +ck(0).peso||null;
 const wk=S.weeks[k]&&+S.weeks[k].w; if(wk) return wk;
 if(k%2===0){const c=+ck(k/2).peso;if(c) return c;}
 return null;}
function goalCurve(){const rates=[];for(let k=1;k<=52;k++) rates.push(k<=4?.01:k<=12?.006:k<=26?.005:k<=40?.004:.0035);
 const raw=[1];for(const r of rates) raw.push(raw[raw.length-1]*(1-r));
 const sw=+S.settings.startWeight,g=+S.settings.goal1,end=raw[52];
 return raw.map(x=>+(sw-(sw-g)*((1-x)/(1-end))).toFixed(1));}
function navyBF(waist,neck,h){if(!waist||!neck||waist<=neck) return null;
 return 495/(1.0324-0.19077*Math.log10(waist-neck)+0.15456*Math.log10(h))-450;}
function derived(c){const h=+S.settings.height,w=+c.peso,o={};
 if(w){o.imc=w/((h/100)**2);}
 if(+c.cintura){o.whtr=+c.cintura/h;}
 const bf=navyBF(+c.cintura,+c.cuello,h); if(bf!=null){o.bf=bf; if(w) o.lean=w*(1-bf/100);}
 return o;}
function trend(){const pts=[];for(let k=0;k<=52;k++){const v=weightAtWeek(k);if(v) pts.push([k,v]);}
 if(pts.length<3) return null;const last=pts.slice(-6);const n=last.length;
 const mx=last.reduce((a,b)=>a+b[0],0)/n,my=last.reduce((a,b)=>a+b[1],0)/n;
 let num=0,den=0;for(const [x,y] of last){num+=(x-mx)*(y-my);den+=(x-mx)**2;}
 const slope=den?num/den:0;return {slope,last:pts[pts.length-1],pts};}
function nutrition(){const lw=latestWeight().v,h=+S.settings.height,a=+S.settings.age;
 const bmr=10*lw+6.25*h-5*a+5, tdee=bmr*1.5;
 let kcal=Math.round((tdee-650)/50)*50; kcal=Math.max(kcal,1800);
 const prot=Math.round(2.0*S.settings.goalFinal/5)*5, fat=Math.round(0.8*S.settings.goalFinal/5)*5;
 const carbs=Math.max(0,Math.round((kcal-prot*4-fat*9)/4/5)*5);
 return {lw,bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,prot,fat,carbs,water:Math.min(4,Math.round(lw*0.033*10)/10)};}

function ruleDigest(){const ti=dayIdx(today()),pos=posOf(ti),out=[];
 const t=trend(), gc=goalCurve(), lw=latestWeight();
 if(ti<0) out.push("El plan arranca pronto. Antes del día 1: revisión médica, medición inicial completa (pestaña Progreso) y fotos.");
 else{
  const lastW=pos.w===1&&pos.p===1?null:(pos.w===1?{p:pos.p-1,w:2}:{p:pos.p,w:1});
  if(lastW){const sd=sessionsDone(lastW.p,lastW.w),ad=activeDone(lastW.p,lastW.w),wd=weekDone(lastW.p,lastW.w),wp=weekPlanned(lastW.p,lastW.w);
   out.push(`Semana pasada: ${sd}/3 sesiones de fuerza, ${ad}/3 días activos y ${wd} de ${wp} series registradas.`+(sd<3?" La meta es no fallar dos días seguidos.":" Bien: así se construye el hábito."));}
  else out.push("Semana 1: el objetivo es aprender la técnica y terminar cada sesión con energía. Registra cada serie.");
  if(!ck(0).peso) out.push("Falta tu medición inicial: llénala en la pestaña Progreso para que las gráficas tengan punto de partida.");
 }
 if(t){const rate=t.slope, k=t.last[0], diff=t.last[1]-gc[k];
  out.push(`Tendencia: ${rate<0?"−":"+"}${Math.abs(rate).toFixed(2)} kg/semana; vas ${Math.abs(diff).toFixed(1)} kg ${diff<=0?"por delante de":"por detrás de"} la meta.`);
  if(rate>-0.2&&k>=4) out.push("Posible estancamiento: baja unas 150 kcal al día o suma 2000 pasos, y revisa sueño y alcohol. Mira también la cintura: si baja, vas bien.");
  if(rate<-1.3&&k>=6) out.push("Estás bajando muy rápido; sube un poco las calorías (unas 150 kcal) para no perder músculo.");
 }
 return out;}
async function renderDigest(){const box=document.getElementById("digest");const rules=ruleDigest();

  for(let k=Math.max(1,pos.week-3);k<=pos.week;k++){const p=Math.ceil(k/2),w=k%2?1:2;summary.semanas.push({semana:k,sesiones_fuerza:sessionsDone(p,w),dias_activos:activeDone(p,w),series:weekDone(p,w)+"/"+weekPlanned(p,w),pasos:S.weeks[k]&&S.weeks[k].steps||null});}
  for(let p=26;p>=1;p--) if(ck(p).cintura){summary.cintura_ultima=ck(p).cintura;break;}
  const r=await window.cowork.askClaude("Eres un entrenador personal experimentado en pérdida de grasa y fuerza para hombres de más de 45 años. Con estos datos de seguimiento escribe en español un comentario breve (3 frases como máximo, sin listas ni emojis): reconoce lo que va bien con datos concretos, señala la prioridad de esta semana y da un consejo práctico. Si no hay registros aún, da ánimo y explica qué registrar primero. No inventes datos.",[summary]);
  if(r&&!r.isError&&r.text){box.innerHTML=`<h4>Comentario del coach</h4><p>${esc(r.text.trim())}</p><div class="who">Escrito por IA a partir de tus registros. Debajo, los datos clave:</div>`+rules.slice(0,2).map(x=>`<p class="muted" style="font-size:13.5px">${esc(x)}</p>`).join("");}
 }catch(e){}}

function sessionHTML(p,w,s){const codes=codesFor(p,s),log=logOf(p,w,s,false)||{sets:{},done:false,note:""},order=sessOrder(p,w,s);
 const d=dateOf((p-1)*14+(w-1)*7+sessDow(s));
 let rows="";
 codes.forEach((code,i)=>{const slot=SLOTS[i],ex=EX[code],n=plannedSets(p,w,slot),unit=unitFor(slot,code);
  const arr=(log.sets[slot]||[]);let cells="";
  for(let j=0;j<n;j++){const x=arr[j]||{};const ok=x&&+x.r>0;
   const kgIn=clsOf(code)==="BW"?"":`<input inputmode="decimal" aria-label="${slot} serie ${j+1} kg" placeholder="kg" data-k="kg" data-j="${j}" value="${esc(x.kg||"")}">`;

  let hint="";const last=lastFor(code,order);
  if(last){const rx=last.arr.map(x=>(x.kg?x.kg+"×":"")+x.r).join(", ");const top=topOf(slot==="D"?"":(slot[0]==="C"?spec(p,w).ar:spec(p,w).mr));

   hint=`<div class="hint${allTop?" up":""}">Última vez (P${last.p} S${last.w} ${last.s}): ${esc(rx)}${allTop?" · llegaste al tope: sube peso":""}</div>`;}

 const sd=setsDone(log),pl=SLOTS.reduce((a,sl)=>a+plannedSets(p,w,sl),0);
 return `<div class="sess${log.done?" done":""}" data-p="${p}" data-w="${w}" data-s="${s}">
 <header><div><h4>${s} · ${esc(SESS_NAME[s].split(" · ")[1])}</h4><span class="muted" style="font-size:13px">${fmt(d)} · ${sd}/${pl} series registradas</span></div>

 <div class="cols">

 <div><h3>El plato de cada comida</h3><ul class="tight"><li>La mitad: verduras (nopales, calabacita, brócoli, ensalada, jitomate, chayote).</li><li>Un cuarto: proteína del tamaño de tu palma o más (pollo, pescado, atún, huevo, res magra, queso panela, yogur griego natural, requesón).</li><li>Un cuarto: carbohidrato del tamaño de tu puño (2 tortillas de maíz, arroz, papa, frijoles, avena, fruta).</li><li>Un pulgar de grasa: aguacate, aceite de oliva, nueces.</li></ul></div>

 <ul class="tight">
 <li><b>De 6 días de pesas a 3 de fuerza + 3 activos.</b> Hacer piernas y espalda 6 días seguidos con 116 kg y 47 años no deja recuperar tendones ni rodillas. Ahora entrenas fuerza lunes, miércoles y viernes con un poco más de volumen por sesión (10–16 series por músculo a la semana, el rango con mejor evidencia), y martes, jueves y sábado caminas y haces core. Sigues moviéndote 6 días.</li>
 <li><b>Agregué caminata y una meta de pasos.</b> "Sin cardio" no ayudaba al corazón ni a la grasa. Caminar no impacta las articulaciones y es lo que más calorías suma. Los pasos suben de 6,000 a 10,000 al día durante el año.</li>
 <li><b>Agregué nutrición.</b> Sin déficit calórico no se pierden 36 kg. La pestaña Nutrición y salud calcula tus calorías y proteína con tu peso real.</li>
 <li><b>Periodos de 2 semanas exactas (26 en el año).</b> Los de 15 días movían el día de cada sesión cada periodo y rompían la rutina semanal. Ahora la sesión A siempre es lunes.</li>
 <li><b>Descargas más frecuentes.</b> Cada 6–7 semanas, no cada 12: a los 47 años la recuperación es lo que permite seguir subiendo de peso sin lesión.</li>
 <li><b>Sesiones balanceadas.</b> Algunas sesiones no tenían empuje ni remo principal (por ejemplo, la C del bloque 1). Ahora cada sesión tiene sentadilla, bisagra de cadera, empuje y tirón.</li>
 <li><b>Meta realista con dos líneas.</b> 116 → 80 kg en un año es un 31 % de tu peso: posible solo con todo perfecto. La meta del año 1 es ${S.settings.goal1} kg (puedes cambiarla en Datos y ajustes) y la final de ${S.settings.goalFinal} kg queda como siguiente etapa. Llegar a 90 kg con mucho más músculo ya es una transformación enorme.</li>
 <li><b>Más medidas y salud.</b> Además de peso y cintura: cadera, cuello (para estimar % de grasa), pecho, brazos, muslos, pantorrilla, presión arterial, pulso en reposo y una prueba de caminata de 6 minutos.</li>
 <li><b>Correcciones menores.</b> Cargas mal escritas ("25 (unilateral) kg (pesado)"), remo renegado con 25 kg como accesorio (bajado), progresión de core y carga más gradual.</li></ul></div>
 <div class="cols">
 <div class="panel"><h3>Calentamiento (8–10 min)</h3><ol class="tight"><li>Marcha en el lugar o caminata rápida: 3 min.</li><li>Gato-camello: 8 repeticiones lentas.</li><li>Flexores de cadera en media rodilla: 30 s por lado.</li><li>Rotaciones torácicas en cuadrupedia: 6 por lado.</li><li>Puente de glúteo sin peso: 12, con 1 s arriba.</li><li>Círculos de brazos y muñecas: 20 s cada uno.</li><li>Sentadilla a silla sin peso: 10.</li><li>Serie de aproximación del primer ejercicio con 5 kg × 10.</li></ol></div>
 <div class="panel"><h3>Vuelta a la calma (5 min)</h3><ol class="tight"><li>Pecho en el marco de una puerta: 30 s.</li><li>Isquiotibiales tumbado: 30 s por lado.</li><li>Figura 4 tumbado: 30 s por lado.</li><li>Postura del niño: 45 s.</li><li>Respiración diafragmática: 5 respiraciones, 4 s dentro y 6 s fuera.</li></ol></div>
 <div class="panel"><h3>Semana tipo</h3><ul class="tight"><li>Lunes: fuerza A.</li><li>Martes: caminata + core.</li><li>Miércoles: fuerza B.</li><li>Jueves: caminata + movilidad.</li><li>Viernes: fuerza C.</li><li>Sábado: caminata larga.</li><li>Domingo: descanso. Cada 2 semanas, medición en la mañana.</li></ul></div>
 <div class="panel"><h3>Cómo leer la prescripción</h3><ul class="tight"><li><b>3 × 10–12</b>: 3 series de 10 a 12 repeticiones. "Por lado" = cada pierna o brazo.</li><li><b>Tempo 3-1-1</b>: 3 s bajando, 1 s de pausa, 1 s subiendo.</li><li><b>RIR</b>: repeticiones que te quedan en reserva. RIR 2 = podrías hacer 2 más con buena técnica.</li><li><b>Doble progresión</b>: cuando completes todas las series en el tope del rango, sube el peso la siguiente sesión y vuelve al mínimo. La app te avisa con "llegaste al tope: sube peso".</li><li><b>Carga guía</b>: es una referencia. Mandan la técnica y el RIR.</li><li>Si tus mancuernas suben de 5 en 5 kg, quédate más tiempo en un peso sumando repeticiones, pausas o tempo antes de saltar.</li></ul></div>
 <div class="panel"><h3>Días perdidos</h3><ul class="tight"><li>¿Faltaste a una sesión? Hazla al día siguiente en lugar del día activo. No juntes dos sesiones en un día.</li><li>¿Faltaste una semana o más? Repite la última semana completa con 10–20 % menos peso.</li><li>Nunca dos días seguidos sin moverte, salvo enfermedad.</li><li>¿Agotado o enfermo? Calentamiento y 1 serie de cada ejercicio. Algo siempre gana a nada.</li></ul></div>
 <div class="panel"><h3>Para no lastimarte</h3><ul class="tight"><li>Técnica antes que peso. Si la última repetición se ve distinta a la primera, la serie terminó.</li><li>Exhala al hacer fuerza; no aguantes la respiración (cuida la presión).</li><li>Sin saltos. Rodillas en línea con los pies.</li><li>Agujetas = normal. Dolor punzante en una articulación = para y cambia por otro ejercicio del mismo patrón.</li><li>Calzado plano y estable. Revisa que las mancuernas ajustables estén bien cerradas.</li></ul></div>
 <div class="panel"><h3>Si pasas el día sentado</h3><ul class="tight"><li>Cada 45–60 min: 2 min de pie, 10 sentadillas a la silla, estiramiento de cadera y 10 retracciones de escápulas.</li><li>Llamadas caminando, escaleras, estaciona lejos: así llegas a tus pasos.</li><li>Pantalla a la altura de los ojos, pies apoyados, codos a 90°.</li></ul></div>
 <div class="panel"><h3>Mentalidad</h3><ul class="tight"><li>Tu memoria muscular existe; tus tendones necesitan tiempo. Respeta el bloque 1.</li><li>El entrenamiento es una reunión no negociable en tu calendario.</li><li>Celebra hitos: 110, 100 y 90 kg, la primera flexión en el suelo, los primeros 25 kg en sentadilla.</li><li>Piensa como ingeniero: mide, analiza cada periodo, ajusta. Pequeños commits diarios, gran release al final del año.</li></ul></div>
 </div>`;}

/* ================= DATOS ================= */
function renderDatos(){const el=document.getElementById("t-datos"),st=S.settings;
 el.innerHTML=`<div class="panel"><h3>Ajustes</h3><div class="grid-form" id="setf">
 <label>Fecha de inicio (lunes)<input type="date" data-s="start" value="${st.start}"></label>
 <label>Estatura (cm)<input inputmode="numeric" data-s="height" value="${st.height}"></label>
 <label>Edad<input inputmode="numeric" data-s="age" value="${st.age}"></label>
 <label>Peso inicial (kg)<input inputmode="decimal" data-s="startWeight" value="${st.startWeight}"></label>
 <label>Meta del año 1 (kg)<input inputmode="decimal" data-s="goal1" value="${st.goal1}"></label>
 <label>Meta final (kg)<input inputmode="decimal" data-s="goalFinal" value="${st.goalFinal}"></label></div>
 <p class="muted">Si empiezas otro día, cambia la fecha de inicio a un lunes y todas las fechas se recorren.</p></div>
 <div class="panel"><h3>Respaldo</h3><p>Tus registros se guardan en este artefacto. Descarga un respaldo cada periodo, por si limpias datos de la app.</p>
 <div class="row"><button class="btn" id="exp">Descargar respaldo (JSON)</button><label class="btn ghost" style="cursor:pointer">Restaurar respaldo<input type="file" id="imp" accept=".json,application/json" hidden></label><button class="btn ghost" id="md">Copiar mediciones en Markdown</button></div>
 <p class="muted">"Copiar mediciones en Markdown" genera la tabla de Seguimiento de progreso para pegarla en tu nota de Obsidian.</p></div>
 <div class="panel"><h3>Borrar todo</h3><p class="muted">Elimina registros, mediciones y ajustes de este artefacto.</p><button class="btn ghost" id="rst" style="border-color:var(--r);color:var(--r)">Borrar todos los datos</button></div>`;
 el.querySelectorAll("[data-s]").forEach(i=>i.addEventListener("change",()=>{let v=i.value.trim();if(i.dataset.s!=="start") v=+v;
  if(i.dataset.s==="start"){const [y,m,d]=v.split("-").map(Number);const dt=new Date(y,m-1,d);if(dt.getDay()!==1){toast("Elige un lunes");i.value=S.settings.start;return;}}
  S.settings[i.dataset.s]=v;save();refreshTop();renderDigest();toast("Ajuste guardado");}));
 document.getElementById("exp").onclick=()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`mancuernas-respaldo-${iso(today())}.json`;document.body.appendChild(a);a.click();a.remove();toast("Respaldo descargado");};
 document.getElementById("imp").onchange=e=>{const f=e.target.files[0];if(!f) return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.settings||!x.logs) throw 0;S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),x);save();refreshTop();renderDigest();toast("Respaldo restaurado");}catch(err){toast("El archivo no es un respaldo válido");}};r.readAsText(f);};
 document.getElementById("md").onclick=()=>{let t="| Momento | Fecha | Peso (kg) | Cintura | Cadera | Cuello | Pecho | Brazo D/I | Muslo D/I | Pantorrilla | % grasa | Presión | Flexiones | Goblet | Plancha (s) | Remo | Caminata 6 min |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n";
  for(let i=0;i<=26;i++){const c=ck(i);if(!c.peso&&!c.cintura) continue;const d=derived(c);t+=`| ${i===0?"Inicio":"P"+i} | ${c.fecha||""} | ${c.peso||""} | ${c.cintura||""} | ${c.cadera||""} | ${c.cuello||""} | ${c.pecho||""} | ${c.brazoD||""}/${c.brazoI||""} | ${c.musloD||""}/${c.musloI||""} | ${c.pantorrilla||""} | ${d.bf!=null?d.bf.toFixed(1):""} | ${c.sist?c.sist+"/"+c.diast:""} | ${c.flex||""} ${c.flexAlt||""} | ${c.goblet||""} | ${c.plancha||""} | ${c.remo||""} | ${c.walk6||""} |\n`;}
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Tabla copiada"),()=>{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast("Tabla copiada");});};
 document.getElementById("rst").onclick=()=>{if(confirm("¿Borrar todos tus registros? No se puede deshacer si no tienes respaldo.")){S=JSON.parse(JSON.stringify(DEFAULTS));save();refreshTop();renderDigest();renderDatos();toast("Datos borrados");}};}

/* ================= INIT ================= */
buildTabs();renderHero();renderHoy();renderDigest();
</script>
